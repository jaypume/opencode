openapi: 3.1.0
info:
  title: Unified Session API
  version: 1.0.0
  description: |
    统一的 Session API,结合了 KiloCode Task 和 OpenCode Session 的优点。
    
    ## 设计原则
    
    1. **以 Session 为核心**: 采用 OpenCode 的 Session 概念,支持持续对话和分支
    2. **补充任务管理**: 借鉴 KiloCode Task 的组织功能(收藏、排序、导出)
    3. **简化权限管理**: 保留核心权限功能,简化 API
    4. **统一事件系统**: 支持 SSE 和 WebSocket 两种方式
    
    ## 核心变更
    
    - Session 添加 `favorite` 和 `status` 字段
    - 支持更丰富的排序和过滤选项
    - 添加导出和批量操作接口
    - 简化 Parts 结构(对外 API)
    - 统一错误响应格式

servers:
  - url: http://localhost:4096/api/v1
    description: 本地开发服务器

security:
  - basicAuth: []

paths:
  # ========== Session 管理 ==========
  
  /session:
    get:
      tags: [Session]
      summary: 获取 Session 列表
      description: 支持分页、过滤和排序
      parameters:
        - name: directory
          in: query
          schema:
            type: string
          description: 按项目目录过滤
        - name: roots
          in: query
          schema:
            type: boolean
          description: 仅返回根 Session(无 parentID)
        - name: search
          in: query
          schema:
            type: string
          description: 按标题搜索(不区分大小写)
        - name: status
          in: query
          schema:
            type: string
            enum: [idle, active, error, archived]
          description: 按状态过滤
        - name: favorite
          in: query
          schema:
            type: boolean
          description: 仅显示收藏的 Session
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, mostTokens, mostCost, mostFiles]
            default: newest
          description: 排序方式
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
          description: 返回数量限制
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: 偏移量(用于分页)
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    
    post:
      tags: [Session]
      summary: 创建 Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parentID:
                  type: string
                  pattern: ^ses_.*
                  description: 父 Session ID(用于 fork)
                title:
                  type: string
                  description: Session 标题
                permission:
                  $ref: '#/components/schemas/PermissionRuleset'
                  description: 权限规则
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
  
  /session/{sessionID}:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    
    get:
      tags: [Session]
      summary: 获取 Session 详情
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
    
    patch:
      tags: [Session]
      summary: 更新 Session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                favorite:
                  type: boolean
                  description: 是否收藏
                archived:
                  type: boolean
                  description: 是否归档
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
    
    delete:
      tags: [Session]
      summary: 删除 Session
      responses:
        '204':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'
  
  /session/{sessionID}/fork:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    
    post:
      tags: [Session]
      summary: Fork Session
      description: 在指定消息处创建分支
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                messageID:
                  type: string
                  pattern: ^msg_.*
                  description: 分支起点消息 ID
      responses:
        '201':
          description: Fork 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  
  /session/{sessionID}/abort:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    
    post:
      tags: [Session]
      summary: 中止 Session
      description: 停止正在执行的 AI 处理
      responses:
        '200':
          description: 中止成功
          content:
            application/json:
              schema:
                type: boolean
  
  /session/{sessionID}/export:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    
    post:
      tags: [Session]
      summary: 导出 Session
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [markdown, json]
            default: markdown
      responses:
        '200':
          description: 导出成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrl:
                    type: string
                    format: uri
  
  /session/{sessionID}/share:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    
    post:
      tags: [Session]
      summary: 分享 Session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility:
                  type: string
                  enum: [public, private, unlisted]
                  default: unlisted
      responses:
        '200':
          description: 分享成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  shareUrl:
                    type: string
                    format: uri
    
    delete:
      tags: [Session]
      summary: 取消分享
      responses:
        '200':
          description: 取消成功
  
  /session/{sessionID}/diff:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    
    get:
      tags: [Session]
      summary: 获取代码变更
      parameters:
        - name: messageID
          in: query
          schema:
            type: string
            pattern: ^msg_.*
          description: 指定消息的变更(可选)
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileDiff'
  
  /session/{sessionID}/summarize:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    
    post:
      tags: [Session]
      summary: 压缩 Session 上下文
      description: 使用 AI 生成摘要并压缩历史消息
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                providerID:
                  type: string
                modelID:
                  type: string
                auto:
                  type: boolean
                  default: false
                  description: 是否自动继续
              required:
                - providerID
                - modelID
      responses:
        '200':
          description: 压缩成功
  
  /session/batch-delete:
    post:
      tags: [Session]
      summary: 批量删除 Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionIDs
              properties:
                sessionIDs:
                  type: array
                  items:
                    type: string
                    pattern: ^ses_.*
      responses:
        '204':
          description: 删除成功
  
  # ========== Message 管理 ==========
  
  /session/{sessionID}/message:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    
    get:
      tags: [Message]
      summary: 获取消息列表
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    
    post:
      tags: [Message]
      summary: 发送消息
      description: 创建用户消息并触发 AI 响应
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  description: 消息内容
                files:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                      filename:
                        type: string
                      mime:
                        type: string
                  description: 文件附件
                agent:
                  type: string
                  description: Agent 名称
                model:
                  type: object
                  properties:
                    providerID:
                      type: string
                    modelID:
                      type: string
                  description: 模型配置
      responses:
        '201':
          description: 消息发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  
  /session/{sessionID}/message/{messageID}:
    parameters:
      - $ref: '#/components/parameters/SessionID'
      - name: messageID
        in: path
        required: true
        schema:
          type: string
          pattern: ^msg_.*
    
    get:
      tags: [Message]
      summary: 获取消息详情
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
    
    delete:
      tags: [Message]
      summary: 删除消息
      responses:
        '204':
          description: 删除成功
  
  # ========== Permission 管理 ==========
  
  /permission/{requestID}/respond:
    parameters:
      - name: requestID
        in: path
        required: true
        schema:
          type: string
          pattern: ^per_.*
    
    post:
      tags: [Permission]
      summary: 响应权限请求
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reply
              properties:
                reply:
                  type: string
                  enum: [once, always, reject]
                message:
                  type: string
                  description: 拒绝原因(可选)
      responses:
        '200':
          description: 响应成功
  
  # ========== Event Stream ==========
  
  /event:
    get:
      tags: [Event]
      summary: 订阅全局事件
      description: 使用 SSE 订阅所有事件
      responses:
        '200':
          description: 事件流
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Event'
  
  /session/{sessionID}/event:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    
    get:
      tags: [Event]
      summary: 订阅 Session 事件
      description: 使用 WebSocket 订阅特定 Session 的事件
      responses:
        '101':
          description: 切换到 WebSocket

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  
  parameters:
    SessionID:
      name: sessionID
      in: path
      required: true
      schema:
        type: string
        pattern: ^ses_.*
      description: Session ID
  
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  
  schemas:
    # ========== 核心实体 ==========
    
    Session:
      type: object
      properties:
        id:
          type: string
          pattern: ^ses_.*
          description: Session ID
        slug:
          type: string
          description: 短标识符
        projectID:
          type: string
          description: 项目 ID
        directory:
          type: string
          description: 项目目录
        parentID:
          type: string
          pattern: ^ses_.*
          description: 父 Session ID(fork)
        title:
          type: string
          description: Session 标题
        version:
          type: string
          description: OpenCode 版本
        status:
          type: string
          enum: [idle, active, error, archived]
          description: Session 状态
        favorite:
          type: boolean
          default: false
          description: 是否收藏
        time:
          type: object
          properties:
            created:
              type: number
              description: 创建时间(毫秒)
            updated:
              type: number
              description: 更新时间(毫秒)
            archived:
              type: number
              description: 归档时间(毫秒)
        summary:
          type: object
          properties:
            additions:
              type: integer
              description: 新增行数
            deletions:
              type: integer
              description: 删除行数
            files:
              type: integer
              description: 修改文件数
        tokens:
          type: object
          properties:
            input:
              type: integer
            output:
              type: integer
            total:
              type: integer
          description: Token 使用统计
        cost:
          type: number
          description: 总成本(美元)
        share:
          type: object
          properties:
            url:
              type: string
              format: uri
          description: 分享信息
        permission:
          $ref: '#/components/schemas/PermissionRuleset'
      required:
        - id
        - projectID
        - directory
        - title
        - status
        - time
    
    Message:
      type: object
      properties:
        id:
          type: string
          pattern: ^msg_.*
        sessionID:
          type: string
          pattern: ^ses_.*
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
          description: 消息内容
        files:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              filename:
                type: string
              mime:
                type: string
          description: 文件附件
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
          description: 工具调用列表
        agent:
          type: string
          description: Agent 名称
        model:
          type: object
          properties:
            providerID:
              type: string
            modelID:
              type: string
        tokens:
          type: object
          properties:
            input:
              type: integer
            output:
              type: integer
        time:
          type: object
          properties:
            created:
              type: number
            updated:
              type: number
        error:
          type: string
          description: 错误信息(如果有)
      required:
        - id
        - sessionID
        - role
        - content
        - time
    
    ToolCall:
      type: object
      properties:
        id:
          type: string
        tool:
          type: string
          description: 工具名称
        status:
          type: string
          enum: [running, completed, error]
        input:
          type: object
          description: 工具输入参数
        output:
          type: string
          description: 工具输出
        metadata:
          type: object
          description: 工具元数据
        time:
          type: object
          properties:
            start:
              type: number
            end:
              type: number
      required:
        - id
        - tool
        - status
    
    PermissionRuleset:
      type: array
      items:
        type: object
        properties:
          permission:
            type: string
            description: 权限名称(bash/edit/external_directory)
          pattern:
            type: string
            description: 匹配模式(支持通配符)
          action:
            type: string
            enum: [allow, deny, ask]
        required:
          - permission
          - pattern
          - action
    
    FileDiff:
      type: object
      properties:
        path:
          type: string
        additions:
          type: integer
        deletions:
          type: integer
        diff:
          type: string
          description: Unified diff 格式
    
    Pagination:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: 错误类型
        message:
          type: string
          description: 错误描述
        details:
          type: object
          description: 错误详情
    
    Event:
      type: object
      properties:
        type:
          type: string
          enum:
            - session.created
            - session.updated
            - session.idle
            - session.error
            - message.created
            - message.updated
            - tool.started
            - tool.completed
            - tool.error
            - permission.asked
            - permission.replied
        timestamp:
          type: number
        sessionID:
          type: string
        data:
          type: object
      required:
        - type
        - timestamp

tags:
  - name: Session
    description: Session 管理接口
  - name: Message
    description: 消息管理接口
  - name: Permission
    description: 权限管理接口
  - name: Event
    description: 事件订阅接口
